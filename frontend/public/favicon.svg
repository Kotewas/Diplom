<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f74ff"/>
      <stop offset="1" stop-color="#22b8a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>

  <g transform="rotate(-8 256 256)" filter="url(#soft)">
    <!-- upper wing (bright) -->
    <polygon points="436,76 238,274 76,202" fill="#ffffff"/>
    <!-- lower fold (dim, gives the paper-plane crease) -->
    <polygon points="436,76 310,436 238,274" fill="#cfe0fb"/>
  </g>
</svg>
