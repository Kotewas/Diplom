server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # не подставлять внутренний порт 80 в редиректы (иначе :5173 пропадает)
  absolute_redirect off;
  port_in_redirect off;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # DB-админка (Adminer) по пути /db, под паролем (basic-auth).
  # Один location без 301-редиректа — чтобы nginx не подменял порт :5173.
  location /db {
    auth_basic "AeroRisk DB";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # резолвер Docker — чтобы nginx стартовал, даже если adminer ещё не поднят
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $adminer_upstream adminer:8080;

    rewrite ^/db/?(.*)$ /$1 break;
    proxy_pass http://$adminer_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
